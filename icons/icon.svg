<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Ring Gradients -->
    <linearGradient id="ringOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="ringMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <radialGradient id="bullseye" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="40%" stop-color="#f97316" />
      <stop offset="85%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </radialGradient>

    <linearGradient id="arrowShaft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <linearGradient id="arrowFlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)" />
      <stop offset="50%" stop-color="rgba(99,102,241,0.2)" />
      <stop offset="100%" stop-color="rgba(217,70,239,0.3)" />
    </linearGradient>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGlow)" />
  
  <!-- Subtle Ambient Glow in Center -->
  <circle cx="256" cy="256" r="190" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
  <circle cx="256" cy="256" r="100" fill="#f97316" opacity="0.12" filter="url(#goldGlow)" />

  <!-- Outer Target Ring -->
  <circle cx="256" cy="256" r="175" fill="none" stroke="url(#ringOuter)" stroke-width="18" opacity="0.35" />
  
  <!-- Middle Target Ring (Segmented / Dash effect) -->
  <circle cx="256" cy="256" r="126" fill="rgba(99,102,241,0.06)" stroke="url(#ringMid)" stroke-width="22" filter="url(#glow)" />
  
  <!-- Inner Ring Accent -->
  <circle cx="256" cy="256" r="76" fill="rgba(249,115,22,0.08)" stroke="#f97316" stroke-width="6" opacity="0.6" />

  <!-- Center Glowing Bullseye -->
  <circle cx="256" cy="256" r="52" fill="url(#bullseye)" filter="url(#goldGlow)" />
  <circle cx="244" cy="244" r="18" fill="#ffedd5" opacity="0.4" />
  <circle cx="256" cy="256" r="12" fill="#ffffff" />

  <!-- Crosshair Accent Marks -->
  <line x1="256" y1="56" x2="256" y2="90" stroke="url(#ringOuter)" stroke-width="8" stroke-linecap="round" />
  <line x1="256" y1="422" x2="256" y2="456" stroke="url(#ringOuter)" stroke-width="8" stroke-linecap="round" />
  <line x1="56" y1="256" x2="90" y2="256" stroke="url(#ringOuter)" stroke-width="8" stroke-linecap="round" />
  <line x1="422" y1="256" x2="456" y2="256" stroke="url(#ringOuter)" stroke-width="8" stroke-linecap="round" />

  <!-- Dynamic Arrow Piercing Bullseye -->
  <!-- Arrow Trail Glow -->
  <path d="M100 412 L248 264" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" opacity="0.4" filter="url(#glow)" />
  <!-- Arrow Shaft -->
  <path d="M105 407 L250 262" stroke="url(#arrowShaft)" stroke-width="12" stroke-linecap="round" />

  <!-- Arrow Fletching / Wings -->
  <g transform="translate(105, 407) rotate(-45)">
    <!-- Top Flight -->
    <path d="M-10 -8 L-38 -28 L-22 -8 Z" fill="url(#arrowFlight)" />
    <!-- Bottom Flight -->
    <path d="M-10 8 L-38 28 L-22 8 Z" fill="url(#arrowFlight)" />
    <!-- Center Nock -->
    <rect x="-28" y="-4" width="22" height="8" rx="3" fill="#ffffff" />
  </g>

  <!-- Arrow Point Highlight at Bullseye -->
  <circle cx="256" cy="256" r="7" fill="#ffffff" filter="url(#goldGlow)" />

  <!-- Magic Sparkles / Achievement Stars -->
  <!-- Sparkle Top Right -->
  <path d="M375 140 Q375 160 395 160 Q375 160 375 180 Q375 160 355 160 Q375 160 375 140 Z" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="375" cy="160" r="4" fill="#ffffff" />

  <!-- Sparkle Bottom Right -->
  <path d="M410 330 Q410 342 422 342 Q410 342 410 354 Q410 342 398 342 Q410 342 410 330 Z" fill="#f59e0b" filter="url(#glow)" />

  <!-- Sparkle Top Left -->
  <path d="M135 150 Q135 160 145 160 Q135 160 135 170 Q135 160 125 160 Q135 160 135 150 Z" fill="#10b981" filter="url(#glow)" />

  <!-- Modern Glass Rim Highlight -->
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="url(#borderGrad)" stroke-width="4" />
</svg>
